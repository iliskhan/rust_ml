[workspace]
resolver = "2"
members = [
    "rustml",
    "rustml-nn",
    "rustml-core",
    "rustml-tensor",
    "rustml-autograd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
authors = ["RustML Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/iliskhan/rust_ml"
description = "Educational CPU tensor and automatic differentiation library for Rust"
keywords = ["machine-learning", "deep-learning", "tensor", "neural-networks"]
categories = ["science", "algorithms", "mathematics"]

[workspace.dependencies]
# Core dependencies для всех crates
ndarray = "0.15"
num-traits = "0.2"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
